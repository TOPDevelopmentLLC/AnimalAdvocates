name: Build & Deploy Web to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Inlined into the client bundle by Vite at build time.
      # Values come from GitHub Actions secrets — never commit them to the repo.
      VITE_EMAIL_API_KEY: ${{ secrets.VITE_EMAIL_API_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      # Public Lambda Function URL for the ShelterLuv proxy — not a secret,
      # just an endpoint address (the real ShelterLuv key lives only in that
      # Lambda's own environment variables, never here).
      VITE_SHELTERLUV_PROXY_URL: ${{ vars.SHELTERLUV_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite web app
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync hashed assets to S3 (long cache)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --exclude "index.html" \
            --exclude "favicon.svg" \
            --exclude "AnimalAdvocatesVerticalLogo.webp" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Upload favicon (short cache)
        if: hashFiles('dist/favicon.svg') != ''
        run: |
          aws s3 cp dist/favicon.svg s3://${{ vars.S3_BUCKET }}/favicon.svg \
            --cache-control "public, max-age=86400" \
            --content-type "image/svg+xml"

      - name: Upload favicon webp (short cache)
        if: hashFiles('dist/AnimalAdvocatesVerticalLogo.webp') != ''
        run: |
          aws s3 cp dist/AnimalAdvocatesVerticalLogo.webp s3://${{ vars.S3_BUCKET }}/AnimalAdvocatesVerticalLogo.webp \
            --cache-control "public, max-age=86400" \
            --content-type "image/webp"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
